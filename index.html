<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mireye Earth | Ask & Fetch API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1>Mireye Earth</h1>
            </div>
            <p class="subtitle">Geospatial Intelligence Interface</p>
        </header>

        <section class="glass-panel request-panel">
            <form id="apiForm" class="form-container">
                
                <div class="mode-selector">
                    <label class="radio-label">
                        <input type="radio" name="mode" value="ask" checked>
                        <span>Ask (Natural Language Q&A)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mode" value="fetch">
                        <span>Fetch (Raw Fields)</span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="address">Address (Use Address OR Coordinates)</label>
                    <input type="text" id="address" placeholder="e.g. 350 5th Ave, New York, NY 10118">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="latitude">Latitude</label>
                        <input type="number" step="any" id="latitude" placeholder="e.g. 46.6">
                    </div>
                    <div class="form-group">
                        <label for="longitude">Longitude</label>
                        <input type="number" step="any" id="longitude" placeholder="e.g. -93.7">
                    </div>
                </div>

                <!-- Ask Mode Inputs -->
                <div class="form-group" id="askInputs">
                    <label for="query">Question</label>
                    <textarea id="query" rows="4" placeholder="Ask something about these coordinates..."></textarea>
                </div>

                <!-- Fetch Mode Inputs -->
                <div class="form-group hidden" id="fetchInputs">
                    <label for="fields">Select Fields</label>
                    <select id="fields" multiple size="6" class="custom-select">
                        <option value="" disabled>Loading fields catalog...</option>
                    </select>
                    <small style="color: var(--text-muted); margin-top: 0.5rem; display: block;">Hold Ctrl/Cmd to select multiple fields.</small>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Send Request</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
        </section>

        <section class="glass-panel response-panel">
            <div class="panel-header">
                <h2>Response</h2>
                <div class="status-indicator" id="statusIndicator">Ready</div>
            </div>
            <div class="response-content" id="responseContainer">
                <p class="placeholder-text">Awaiting your query...</p>
            </div>
        </section>
    </main>

    <script type="module" src="/script.js"></script>
</body>
</html>
